<header class="site-header">
    <div class="container">
        <div class="header-content">
            <!-- 网站标题 -->
            <div class="site-brand">
                <a href="/" class="site-title">
                    <span class="logo">📝</span>
                    <span class="title-text">{{ config.BLOG_TITLE }}</span>
                </a>
                <p class="site-description">{{ config.BLOG_DESCRIPTION }}</p>
            </div>
            
            <!-- 导航菜单 -->
            <nav class="main-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="/" class="nav-link">首页</a>
                    </li>
                    <li class="nav-item">
                        <a href="/archives.html" class="nav-link">归档</a>
                    </li>
                    <li class="nav-item">
                        <a href="/categories.html" class="nav-link">分类</a>
                    </li>
                    <li class="nav-item">
                        <a href="/tags/" class="nav-link">标签</a>
                    </li>
                    <li class="nav-item">
                        <a href="/links.html" class="nav-link">友链</a>
                    </li>
                    <li class="nav-item">
                        <a href="/about.html" class="nav-link">关于</a>
                    </li>
                    {% if config.RSS_ENABLED %}
                    <li class="nav-item">
                        <a href="/{{ config.RSS_FILE }}" class="nav-link">RSS</a>
                    </li>
                    {% endif %}
                </ul>
            </nav>
            
            <!-- 搜索框 -->
            {% if config.SEARCH_ENABLED %}
            <div class="header-search">
                <form action="/search" method="get" class="search-form">
                    <input type="text" name="q" placeholder="搜索文章..." 
                           class="search-input" aria-label="搜索">
                    <button type="submit" class="search-button" aria-label="搜索">
                        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                    </button>
                </form>
            </div>
            {% endif %}
            
            <!-- 主题切换按钮 -->
            <div class="theme-switcher">
                <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
                    <span class="theme-icon light-icon">🌞</span>
                    <span class="theme-icon dark-icon">🌙</span>
                </button>
            </div>
            
            <!-- 移动端菜单按钮 -->
            <button class="mobile-menu-toggle" aria-label="切换菜单">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </div>
</header>
